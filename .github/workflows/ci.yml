name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check Node.js version
        run: node --version && npm --version
      - run: npm install
      - run: npm test
      - name: E2E (Carlos workflow)
        run: npm run test:e2e
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: P0 gates
        run: npm run test:p0
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: Trigger engine E2E
        run: npm run test:trigger
        env:
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build check (no build step for ESM)
        run: echo "ESM source, no build needed"
      - name: Lint (placeholder)
        run: npm run lint