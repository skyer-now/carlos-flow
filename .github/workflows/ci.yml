name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # 必须固定 Node 版本：package.json 要求 >=22，而 runner 默认 Node 会随平台漂移
      # （曾出现 runner 默认 20 → 与 engines 不符）。显式 setup 后行为可复现。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Node.js version
        run: node --version && npm --version
      # 用 npm ci（按 lock 精确安装）而不是 npm install（会重新解析依赖、可能引入漂移）
      - run: npm ci
      - run: npm test
      - name: E2E (Carlos workflow)
        run: npm run test:e2e
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: P0 gates
        run: npm run test:p0
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      # 变异体锚点体检：确认 mutation-check 的每个注入锚点仍能命中当前源码。
      # 锚点失效时 mutation-check 会记 SKIP —— 不假绿，但**失去了守护作用**，
      # 而历史报告仍可能显示「13/13 全部被抓住」，属于静默退化。
      - name: Mutant anchors still valid
        run: npm run check:anchors
      # 端到端验收（npm 包到真实可用）：必须进 CI —— 它验的是「装包后能不能用起来」，
      # 只在本地跑就失去了「CI 绿 = 可发布」的含义。
      - name: End-to-end acceptance (npm-package path)
        run: npm run test:acceptance
        env:
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-acceptance
      - name: Trigger engine E2E
        run: npm run test:trigger
        env:
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      # 跨进程并发回归：它曾抓出真实的激活闸门竞态绕过，不能省。
      - name: Cross-process concurrency regression
        run: npm run test:concurrency
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-concurrency-home
          # 并发套件在高负载下偶发「假泄漏」，偶发红会阻塞合并 → 允许重跑一次。
          # 两次都红才判失败，真缺陷不会被重试掩盖。
          CONCURRENCY_RETRY: 1
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build check (no build step for ESM)
        run: echo "ESM source, no build needed"
      - name: Lint (placeholder)
        run: npm run lint

  # 单包一致性守卫：身份 / 版本 / 文档 / 产物 四类一致性。
  # v2.5.x 的「双仓一致性」在 v2.6.0 单包化后已无意义（跨版本漂移的根因 ——
  # 两份核心逻辑各自维护 —— 已被消除），但「对外宣称的身份与产物必须一致」
  # 这个诉求更重要：单一包对外是一个统一的六平台产品，任何一处版本号 /
  # 文档 / 清单不一致都会直接暴露给用户。
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 单包一致性检查（身份 / 版本 / 文档 / 产物）
        run: node scripts/check-repo-parity.mjs
      # 产物全面体检：旧引用 / 个人路径 / 版本一致性 / 死链 / 发布集合 / 工具清单
      - name: 产物全面体检（对外产物是否正确）
        run: npm run check:full
      # 行为兑现类门禁：承诺 ↔ 代码路径 / 参数不得静默失效 / 不得重复注册 handler。
      # 现有门禁擅长查「静态一致性」，不擅长查「行为兑现」——
      # 2026-11-07 第三方审查发现的 P0/P1 问题一个都没被现有门禁抓到。
      - name: 行为兑现门禁（承诺 / 参数 / 重复注册）
        run: |
          npm run check:claims
          npm run check:params
          npm run check:no-dead-handler
      # 专项真实验证：真实 git 仓库 / 真实篡改 / 真实 bridge 隔离 / 真实安装
      - name: 专项真实验证（scope / 审计链 / bridge 隔离）
        run: |
          npm run test:scope
          npm run test:audit
          npm run test:bridge
      # 产物语言体检：提交信息 / 源码注释必须是中文。
      # 2026-11-07 的事故根因正是「对话是中文的、但提交信息是英文的」——
      # 靠人扫「回复」发现不了，必须机器单独检查产物。
      - name: 产物语言体检（提交信息 / 注释必须中文）
        run: npm run check:lang
      # 语言体检的自检：验证体检脚本**真的能抓到英文**（避免引入一个假绿守卫）
      - name: 语言体检自检（故意放英文必须被抓出）
        run: npm run test:lang
      - name: 变异体锚点体检
        run: npm run check:anchors

  # Bridge 门禁：真 RPC 往返验证。
  #
  # 为什么单独一个 job：现有门禁擅长查「静态一致性」（文件在不在、版本对不对），
  # 但查不出「进程起来了、转发断了」这一类缺陷 —— 2026-11-13 的 Bridge 精简事故
  # 就是静态检查全绿、实际 tools/list 一个工具都拿不到。
  # 现在起，Bridge 必须真起一遍、真发一遍 initialize + tools/list，
  # 断言拿回全部 19 个工具，否则本 job 变红。
  #
  # 为什么还要跑 windows-latest：黑控制台窗口是 Windows 专属问题，
  # windowsHide 只有在 Windows 上跑才有意义；ubuntu 只验协议链路。
  bridge:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gatekeeper：语法校验 + 真 RPC 往返冒烟测试
        run: ./check-all.sh
        env:
          CARLOS_BRIDGE_TOKEN: ci-gatekeeper-token
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-ci-home

  # 变异测试：验证测试套件本身能抓住退化（激活只打印日志 / 闸门失效 / 会话撞名 …）
  # 耗时较长，不在每次 push 跑；手动触发或发布前跑。
  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm ci
      - name: Mutation check (13 类退化必须全部被抓住)
        run: npm run test:mutation
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-mutation-home
          MUTATION_REPORT: ${{ github.workspace }}/.mutation-report.md
      - name: 上传变异测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ${{ github.workspace }}/.mutation-report.md
          if-no-files-found: error
