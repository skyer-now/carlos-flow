name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check Node.js version
        run: node --version && npm --version
      - run: npm install
      - run: npm test
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build check (no build step for ESM)
        run: echo "ESM source, no build needed"
      - name: Lint (placeholder)
        run: npm run lint