name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Node.js version
        run: node --version && npm --version
      - run: npm ci
      - run: npm test
      - name: E2E (Carlos workflow)
        run: npm run test:e2e
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: P0 gates
        run: npm run test:p0
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: Mutant anchors still valid
        run: npm run check:anchors
      - name: End-to-end acceptance (npm-package path)
        run: npm run test:acceptance
      - name: A1 验证-代码状态绑定（STALE 必须阻断 PASS）
        run: npm run test:stale
        env:
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-acceptance
      - name: Trigger engine E2E
        run: npm run test:trigger
        env:
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: Cross-process concurrency regression
        run: npm run test:concurrency
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-concurrency-home
          CONCURRENCY_RETRY: 1
      - name: 门禁加固回归（敏感规则 / 状态锁 / 负对照还原 / MCP 协议 / 两段式分发）
        run: |
          npm run test:sensitive
          npm run test:lock
          npm run test:falsify
          npm run test:mcp
          npm run test:dispatch
          npm run test:hardening
          npm run test:cas
          npm run test:roll
          npm run test:prune
          npm run test:stage2
          npm run test:worktree
          npm run test:ast
          npm run test:facade
          npm run check:ast
          # 互审体系（含变异测试）与 Windows 运行时：必须进 CI ——
          # 这两个套件此前只在发布流水线跑，等于没被日常守护；
          # v3.1.0 首发失败就是在这个盲区里发生的。
          npm run test:advisory
          npm run test:advisory-int
          npm run test:advisory-mut
          npm run test:windows
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build check (no build step for ESM)
        run: echo "ESM source, no build needed"
      - name: Lint (placeholder)
        run: npm run lint

  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 单包一致性检查（身份 / 版本 / 文档 / 产物）
        run: node scripts/check-repo-parity.mjs
      - name: 产物全面体检（对外产物是否正确）
        run: npm run check:full
      - name: 模板渲染门禁（Windows 路径渲染必须可解析）
        run: npm run check:templates
      - name: 跨平台可移植性（路径 / 进程树 / 归一）
        run: npm run check:portability
      - name: 行为兑现门禁（承诺 / 参数 / 重复注册）
        run: |
          npm run check:claims
          npm run check:params
          npm run check:no-dead-handler
      - name: 专项真实验证（scope / 审计链 / bridge 隔离）
        run: |
          npm run test:scope
          npm run test:audit
          npm run test:bridge
      - name: 产物语言体检（提交信息 / 注释必须中文）
        run: npm run check:lang
      - name: 语言体检自检（故意放英文必须被抓出）
        run: npm run test:lang
      - name: 变异体锚点体检
        run: npm run check:anchors

  bridge:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gatekeeper：语法校验 + 真 RPC 往返冒烟测试
        run: bash ./check-all.sh
        env:
          CARLOS_BRIDGE_TOKEN: ci-gatekeeper-token
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-ci-home

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm ci
      - name: Mutation check (20 类退化必须全部被抓住)
        run: npm run test:mutation
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-mutation-home
          MUTATION_REPORT: ${{ github.workspace }}/.mutation-report.md
      - name: 上传变异测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ${{ github.workspace }}/.mutation-report.md
          if-no-files-found: error
