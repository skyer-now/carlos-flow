name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check Node.js version
        run: node --version && npm --version
      - run: npm install
      - run: npm test
      - name: E2E (Carlos workflow)
        run: npm run test:e2e
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: P0 gates
        run: npm run test:p0
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      - name: Trigger engine E2E
        run: npm run test:trigger
        env:
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-home
      # 跨进程并发回归：它曾抓出真实的激活闸门竞态绕过，不能省。
      - name: Cross-process concurrency regression
        run: npm run test:concurrency
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-concurrency-home
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build check (no build step for ESM)
        run: echo "ESM source, no build needed"
      - name: Lint (placeholder)
        run: npm run lint

  # 双仓一致性守卫：防止 cindy ↔ opencode 两版身份混淆
  # （历史上曾把 Cindy 版 README 整份覆盖到 opencode 仓，导致该仓对外宣称自己是 Cindy 版）。
  # 只在本地有对方仓时有效 —— CI 里对方仓不存在时脚本应跳过而非报错。
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 双仓一致性检查
        continue-on-error: true
        run: |
          PEER="../carlos-flow-${{ github.event.repository.name == 'carlos-flow-cindy' && 'opencode' || 'cindy' }}"
          if [ -d "$PEER" ]; then
            node scripts/check-repo-parity.mjs "$PEER"
          else
            echo "跳过：CI 单仓检出，找不到对方仓 $PEER（本地双仓 checkout 时生效）"
          fi

  # 变异测试：验证测试套件本身能抓住退化（激活只打印日志 / 闸门失效 / 会话撞名 …）
  # 耗时较长，不在每次 push 跑；手动触发或发布前跑。
  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm ci
      - name: Mutation check (13 类退化必须全部被抓住)
        run: npm run test:mutation
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-mutation-home
          MUTATION_REPORT: ${{ github.workspace }}/.mutation-report.md
      - name: 上传变异测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ${{ github.workspace }}/.mutation-report.md
          if-no-files-found: error
