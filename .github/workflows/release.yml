name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.6.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    # 保留版本校验、管道退出码和发布脚本的 bash 语义。
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: 准备测试日志目录
        run: mkdir -p "$RUNNER_TEMP/logs"
      # 发布前跑**完整**测试套件（与 CI 逐套件对齐，便于失败时在步骤名上直接定位）。
      # 套件组成：smoke + e2e-carlos + p0-gates + trigger-e2e + concurrency + acceptance
      # （含跨进程并发回归——它曾抓出真实的激活闸门竞态绕过，不可省）
      # 为什么拆成多步而不是一句 test:all：run 失败只显示“命令退出 1”，
      # 拆开后失败步骤名直接指出是哪一组，无需下载日志就能定位。
      - name: 测试·基础与门禁主链（smoke / baseline / e2e / p0 / 发布闸 / STALE）
        run: ( npm run test && npm run test:baseline && npm run test:e2e && npm run test:p0 && npm run test:gate && npm run test:stale ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-01.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          # 隔离状态目录：不给的话测试会写 runner 的 ~/.carlos-flow（runner home 可能是共享/缓存的）
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·触发引擎与跨进程并发
        run: ( npm run test:trigger && npm run test:concurrency ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-02.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-concurrency-home
          # 与 CI 一致：并发套件在高负载下偶发假泄漏，允许重跑一次；两次都红才算失败。
          CONCURRENCY_RETRY: 1
      - name: 测试·端到端验收（npm 包到真实可用）
        run: ( npm run test:acceptance ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-03.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      # 门禁加固链：逐个套件独立成步。
      # 背景：2026-11-24 v3.1.0 首发失败在这个组里，而 run 摘要只显示「命令退出 1」——
      # 所有者看不了日志（非仓库 admin），只能靠猜。拆成单步后，失败直接落在套件名上。
      - name: 测试·敏感规则（只增不减 / 否定式无效 / 坏配置退基线）
        run: ( npm run test:sensitive ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-04.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·状态锁（退避 / 死锁回收 / fail-closed）
        run: ( npm run test:lock ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-05.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·负对照还原核对（journal / 链接逃逸 / 故障关闭）
        run: ( npm run test:falsify ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-06.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·MCP 协议层（握手 / stdout 纯净 / 未知方法）
        run: ( npm run test:mcp ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-07.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·chip 两段式目录（真实服务端 + main.js）
        run: ( npm run test:dispatch ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-08.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·门禁加固（超时整树回收 / 输出截断 / 快照去重）
        run: ( npm run test:hardening ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-09.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·长验证并发合并与证据绑定（CAS）
        run: ( npm run test:cas ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-10.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·审计分片滚动（流式校验 / 篡改可检出）
        run: ( npm run test:roll ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-11.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·存储清理（只归档终态 / 可搬回）
        run: ( npm run test:prune ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-12.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·失败记忆与质检单（项目隔离 / 忠于证据）
        run: ( npm run test:stage2 ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-13.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·任务工作区隔离（worktree / 越界拒绝）
        run: ( npm run test:worktree ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-14.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·AST 断言敏感性（删断言 / 改期望值必须检出）
        run: ( npm run test:ast ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-15.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·四门面收敛（动作全覆盖 / 真实路由）
        run: ( npm run test:facade ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-16.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·断言敏感性门禁（check:ast）
        run: ( npm run check:ast ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-17.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·专项真实（越界 / 审计链 / bridge 隔离 / 清理命令）
        run: ( npm run test:scope && npm run test:audit && npm run test:bridge && npm run test:clean ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-18.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·UI / 单元 / 原子写 / 编码
        run: ( npm run test:ui && npm run test:unit && npm run test:atomic && npm run test:encoding ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-19.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      - name: 测试·互审体系与 Windows 运行时（含变异测试）
        run: ( npm run test:advisory && npm run test:advisory-int && npm run test:advisory-mut && npm run test:windows ) 2>&1 | tee "$RUNNER_TEMP/logs/suite-20.log"
        env:
          CARLOS_FLOW_MCP_ROOT: ${{ github.workspace }}
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      # 失败诊断：把失败套件的原始输出转成公开运行注解（::error::）。
      # 背景：仓库所有者没有 admin 权限，下载不了 Actions 日志（403），
      # 失败只显示「进程退出码 1」；运行注解是公开可读的，能直接看到失败断言。
      - name: 失败诊断（失败套件原始输出转成公开运行注解）
        if: failure()
        run: node scripts/ci-annotate-logs.mjs
      - name: 钩子安装与最新状态校验（check:hooks）
        run: npm run check:hooks
      # 单包一致性守卫：身份 / 版本 / 文档 / 产物 必须一致
      - name: 单包一致性检查
        run: node scripts/check-repo-parity.mjs
      # 产物全面体检：发布前最后一道闸 —— 旧引用 / 个人路径 / 死链 /
      # 发布集合完整性 / ghost.json 工具清单，这些都不会让测试变红，
      # 但会直接让用户看到错误信息。
      - name: 产物全面体检（对外产物是否正确）
        run: npm run check:full
      # 行为兑现类门禁 + 专项真实验证：发布前最后一道闸
      - name: 行为兑现门禁 + 专项真实验证
        run: |
          npm run check:claims
          npm run check:params
          npm run check:no-dead-handler
          npm run test:scope
          npm run test:audit
          npm run test:bridge
      # 产物语言体检：发布前最后一道闸。提交信息 / 注释必须是中文 ——
      # 产物会进 GitHub、进 npm 包，影响面比一次对话大得多。
      - name: 产物语言体检（提交信息 / 注释必须中文）
        run: npm run check:lang
      - name: 语言体检自检（故意放英文必须被抓出）
        run: npm run test:lang
      # tag 与 package.json 版本必须一致，否则发出去的包版本对不上
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "✗ tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VER} 不一致"
            exit 1
          fi
          echo "✓ tag ${GITHUB_REF_NAME} == package.json ${PKG_VER}"
      # 发布到 npm（**幂等**）
      #
      # 为什么需要幂等：版本可能已经由维护者本地 `npm publish` 上线
      # （网络受限 / 凭据配置差异时这是常见路径）。此时再跑一次 publish 会
      # 直接 409「Cannot publish over previously staged version」，
      # 整个 workflow 红掉 —— 但包其实已经在 registry 里了。
      #
      # 两道防线（缺一不可）：
      #   1) 预检查：查 registry，已存在就跳过；
      #   2) 兜底：即使预检查因**传播延迟**查不到（刚发布完的版本
      #      通常要几十秒才可查），publish 报 409 时也视为成功。
      #      只做第 1 道是不够的 —— 那正是本 workflow 失败的原因。
      # 发布闸：只有 tag 版本**高于** registry 上已发布的最大版本时才发布。
      #
      # 为什么需要：release.yml 触发条件是 `push: tags: ['v*']` —— 补历史版本的
      # tag（如 v2.10.0）也会触发。若不设版本比较闸，npm publish 会：
      #   (a) 把 dist-tags.latest 拉回旧版（用户 `npm i carlos-flow` 装到旧代码）；
      #   (b) 破坏「git tag ↔ npm 版本 ↔ GitHub Release」的对齐。
      # 加了这道闸，补历史 tag 只建 Release、不发 npm，latest 不被回退。
      #
      # 怎么算版本：semver 比较。最高已发布版本取自 packument 的 dist-tags.latest
      # （用 `--prefer-online` 绕本地缓存；CDN 传播延迟用 registry 版本数做兜底——
      # 版本数>1 才可信，否则按「暂无已发布版本」处理，允许发布）。
      # ⚠️ 2026-11-13 修过一次真实 bug：旧实现把 semver 比较的**退出码方向写反了** ——
      #    条件成立时反而进「不高于」分支，于是「版本更高」被拦住、「版本更低」被放行。
      #    后果：v2.11.2 被拦在 npm 之外，而补历史 tag 反而能发（正好与发布闸本意相反）。
      # 现在判定逻辑抽到 scripts/publish-gate.mjs，并有单测 test/publish-gate.test.mjs
      # 锁住方向，workflow 只负责调用。
      - name: 发布闸：tag 版本必须高于已发布最新版本
        id: gate
        run: node scripts/publish-gate.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # ===== 发布暂停开关（默认暂停） =====
          # RELEASE_PAUSED=1 停止 npm publish（只建 GitHub Release）
          # RELEASE_PAUSED=0 恢复正常发布
          # 恢复指令：把值改为 0 并推 tag，即可获得下一次的 npm 发布
          RELEASE_PAUSED: '0'

      # 发布到 npm（有发布闸守卫，已存在/旧版本均跳过；409 兜底）
      - name: 发布到 npm（发布闸放行时才执行）
        id: npm_publish
        if: steps.gate.outputs.publish == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "registry 暂未查到 ${VERSION}（可能刚发布、传播延迟），尝试发布"
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qE "E409|Cannot publish over|previously (published|staged)" /tmp/publish.log; then
            echo "✅ npm 返回 409（该版本已存在）—— 视为已发布，继续后续步骤"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "❌ npm publish 失败（退出码 ${CODE}）"
            # 失败原因写进公开注解：所有者无 admin 权限，下载不了 Actions 日志。
            node scripts/annotate-publish-log.mjs /tmp/publish.log || true
            exit "$CODE"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 发布后核验：命令退出码变成绿**不等于**包已经上线。
      # 2026-11-24 v3.1.0 就出现过：publish 步骤绿，但 registry 里根本没有 3.1.0
      # （409 兜底被误当「已发布」）。这里以 registry 可查为准，查不到就红。
      - name: 发布后核验（registry 必须能查到本轮版本）
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/verify-npm-publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 创建 GitHub Release（只要构建测试通过，无论 npm 处于何种分支，均确保第一时间生成 Release 记录）
      - name: 创建 GitHub Release
        if: always() && steps.gate.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Carlos Flow ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布后实测安装：从 registry 真装本轮版本，再用真实 MCP 握手验证。
      # 为什么入流水线：发布基线写了「发布后必须实测安装」，
      # 只在人/Agent 记忆里执行等于没执行（v3.1.0 落地时就是手工验的）。
      - name: 发布后实测安装（真实 tarball + MCP 握手 + 产物洁净）
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/verify-release-install.mjs
