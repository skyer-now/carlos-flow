name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.6.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # 发布前跑**完整**测试套件，而不是只跑 smoke。
      # 套件组成：smoke + e2e-carlos + p0-gates + trigger-e2e + concurrency + acceptance
      # （含跨进程并发回归——它曾抓出真实的激活闸门竞态绕过，不可省）
      - run: npm run test:all
        env:
          # 隔离状态目录：不给的话测试会写 runner 的 ~/.carlos-flow（runner home 可能是共享/缓存的）
          CARLOS_FLOW_HOME: ${{ runner.temp }}/carlos-flow-release-home
      # 单包一致性守卫：身份 / 版本 / 文档 / 产物 必须一致
      - name: 单包一致性检查
        run: node scripts/check-repo-parity.mjs
      # 产物全面体检：发布前最后一道闸 —— 旧引用 / 个人路径 / 死链 /
      # 发布集合完整性 / ghost.json 工具清单，这些都不会让测试变红，
      # 但会直接让用户看到错误信息。
      - name: 产物全面体检（对外产物是否正确）
        run: npm run check:full
      # 行为兑现类门禁 + 专项真实验证：发布前最后一道闸
      - name: 行为兑现门禁 + 专项真实验证
        run: |
          npm run check:claims
          npm run check:params
          npm run check:no-dead-handler
          npm run test:scope
          npm run test:audit
          npm run test:bridge
      # 产物语言体检：发布前最后一道闸。提交信息 / 注释必须是中文 ——
      # 产物会进 GitHub、进 npm 包，影响面比一次对话大得多。
      - name: 产物语言体检（提交信息 / 注释必须中文）
        run: npm run check:lang
      - name: 语言体检自检（故意放英文必须被抓出）
        run: npm run test:lang
      # tag 与 package.json 版本必须一致，否则发出去的包版本对不上
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "✗ tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VER} 不一致"
            exit 1
          fi
          echo "✓ tag ${GITHUB_REF_NAME} == package.json ${PKG_VER}"
      # 发布到 npm（**幂等**）
      #
      # 为什么需要幂等：版本可能已经由维护者本地 `npm publish` 上线
      # （网络受限 / 凭据配置差异时这是常见路径）。此时再跑一次 publish 会
      # 直接 409「Cannot publish over previously staged version」，
      # 整个 workflow 红掉 —— 但包其实已经在 registry 里了。
      #
      # 两道防线（缺一不可）：
      #   1) 预检查：查 registry，已存在就跳过；
      #   2) 兜底：即使预检查因**传播延迟**查不到（刚发布完的版本
      #      通常要几十秒才可查），publish 报 409 时也视为成功。
      #      只做第 1 道是不够的 —— 那正是本 workflow 失败的原因。
      # 发布闸：只有 tag 版本**高于** registry 上已发布的最大版本时才发布。
      #
      # 为什么需要：release.yml 触发条件是 `push: tags: ['v*']` —— 补历史版本的
      # tag（如 v2.10.0）也会触发。若不设版本比较闸，npm publish 会：
      #   (a) 把 dist-tags.latest 拉回旧版（用户 `npm i carlos-flow` 装到旧代码）；
      #   (b) 破坏「git tag ↔ npm 版本 ↔ GitHub Release」的对齐。
      # 加了这道闸，补历史 tag 只建 Release、不发 npm，latest 不被回退。
      #
      # 怎么算版本：semver 比较。最高已发布版本取自 packument 的 dist-tags.latest
      # （用 `--prefer-online` 绕本地缓存；CDN 传播延迟用 registry 版本数做兜底——
      # 版本数>1 才可信，否则按「暂无已发布版本」处理，允许发布）。
      # ⚠️ 2026-11-13 修过一次真实 bug：旧实现把 semver 比较的**退出码方向写反了** ——
      #    条件成立时反而进「不高于」分支，于是「版本更高」被拦住、「版本更低」被放行。
      #    后果：v2.11.2 被拦在 npm 之外，而补历史 tag 反而能发（正好与发布闸本意相反）。
      # 现在判定逻辑抽到 scripts/publish-gate.mjs，并有单测 test/publish-gate.test.mjs
      # 锁住方向，workflow 只负责调用。
      - name: 发布闸：tag 版本必须高于已发布最新版本
        id: gate
        run: node scripts/publish-gate.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # ===== 发布暂停开关（默认暂停） =====
          # RELEASE_PAUSED=1 停止 npm publish（只建 GitHub Release）
          # RELEASE_PAUSED=0 恢复正常发布
          # 恢复指令：把值改为 0 并推 tag，即可获得下一次的 npm 发布
          RELEASE_PAUSED: '1'

      # 发布到 npm（有发布闸守卫，已存在/旧版本均跳过；409 兜底）
      - name: 发布到 npm（发布闸放行时才执行）
        id: npm_publish
        if: steps.gate.outputs.publish == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "registry 暂未查到 ${VERSION}（可能刚发布、传播延迟），尝试发布"
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qE "E409|Cannot publish over|previously (published|staged)" /tmp/publish.log; then
            echo "✅ npm 返回 409（该版本已存在）—— 视为已发布，继续后续步骤"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "❌ npm publish 失败（退出码 ${CODE}）"
            exit "$CODE"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 创建 GitHub Release（无论 npm 是否是本次发的，都要有 Release 记录）
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Carlos Flow ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
